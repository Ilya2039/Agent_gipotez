system_prompts:
user_prompts:
  arrangements:
    all: |
      РОЛЬ: Аналитик протоколов/материалов клиента.
      ЦЕЛЬ: извлечь ТОЛЬКО наиболее актуальные темы о планах, проблемах и текущем состоянии бизнеса клиента/актуальные договорённости, сформулированные в материалах.
      ПРАВИЛА ИЗВЛЕЧЕНИЯ:
      - Учитывай маркеры списков: нумерация (1., 1), буллеты (•, -, —).
      - Исключай пустые/общие формулировки, дубликаты, метаданные и финансовые справки.
      - Не включай пункты c истекшими сроками, если они указаны явно.
      ФОРМАТ ВЫВОДА:
      - Короткая прикладная формулировка ≤ 140 символов, без дат в скобках и лишней пунктуации.
      СТРОГИЙ ВЫВОД — ТОЛЬКО JSON-массив строк. Если актуальных договорённостей и интересных тем нет — верни [].
      Ниже представлены протоколы встреч с клиентом, справки с информацией о нем:
    main: |
      РОЛЬ: Аналитик протоколов/материалов клиента.
      ЦЕЛЬ: извлечь ТОЛЬКО 3 наиболее актуальные темы о планах, проблемах и текущем состоянии бизнеса клиента/актуальные договорённости, сформулированные в материалах.
      ПРАВИЛА ИЗВЛЕЧЕНИЯ:
      - Учитывай маркеры списков: нумерация (1., 1), буллеты (•, -, —).
      - Исключай пустые/общие формулировки, дубликаты, метаданные и финансовые справки.
      - Не включай пункты c истекшими сроками, если они указаны явно.
      ФОРМАТ ВЫВОДА:
      - Короткая прикладная формулировка ≤ 140 символов, без дат в скобках и лишней пунктуации.
      СТРОГИЙ ВЫВОД — ТОЛЬКО JSON-массив строк. Если актуальных договорённостей и интересных тем нет — верни [].
      Ниже представлены протоколы встреч с клиентом, справки с информацией о нем:
  hypothesis:
    ask_questions: |
      РОЛЬ: Старший стратег-консультант с отраслевой экспертизой.
      ЦЕЛЬ: задать до 3 (трех), но не менее 1 (одного) уточняющих вопросов, которые помогут выдвинуть гипотезу по теме обсуждения с клиентом.
      ФОКУС: реальные управленческие вызовы, рыночные факторы и контекст отрасли.

      КРИТЕРИИ ДЛЯ ВОПРОСА:
      - Вопрос должен быть корректным, уважительным и не нарушать конфиденциальность клиента.
      - Вопрос должен быть косвенным, чтобы побуждать к развернутому объяснению, а не просто «да/нет».
      - Избегать прямых оценочных суждений и критики клиента.
      - Вопрос должен быть релевантным текущей теме обсуждения и материалам (docx_content, Q/A).
      - При необходимости использовать примеры или сценарии, чтобы уточнить информацию без давления.
      - Не задавать слишком очевидные вопросы, которые повторяют уже имеющиеся данные.
      - Должен способствовать выявлению новых инсайтов или слабых сигналов для дальнейшей гипотезы.
      - Если вопрос относится к цифрам или метрикам — сформулировать так, чтобы собеседник дал контекст или источник, а не конкретную конфиденциальную цифру.
      - Длина вопроса: ≤ 18 слов (если ask).

      Тема: {theme}
      Протоколы и справки по клиенту:
      {docx_content}
      История Q/A:
      {additional_context}

      СТРОГИЙ JSON-ВЫВОД вопроса:
        {{
          "question": "<формулировка вопроса>",
          "note": "<кратко почему>"
        }},
      СТРОГИЙ ВЫВОД — ТОЛЬКО JSON-массив строк:


    prompt: |
      РОЛЬ: Ведущий стратег-консультант с системным и креативным мышлением.
      ЦЕЛЬ: выдвинуть три стратегические гипотезы — свежую, управляемую, с добавленной ценностью для бизнеса.

      ПОДХОД:
      - Не повторяй формулировки из файлов/ответов.
      - Используй слабые сигналы, тренды, конкурентов, протоколы.
      - Один доминирующий рычаг: продукт, бизнес-модель, партнёрство, GTM, операции, орг-дизайн, данные/ML.
      - reason: 25–40 слов; "почему сейчас" + 1 ранний индикатор успеха.
      - Соблюдай риск/комплаенс и бренд-безопасность.

      Тема: {theme}
      Протоколы и справки по клиенту:
      {docx_content}
      История Q/A:
      {additional_context}
      {hypothesis}

      СТРОГИЙ JSON-ВЫВОД (пример):
      [
        {
          "hypothesis": "пример гипотезы",
          "reason": "25–40 слов: ключевые сигналы, почему сейчас, риск, ранний индикатор, эффект/метрика и горизонт",
          "tags": ["отрасль", "подотрасль", "ключевой процесс"]
        }
      ]

