upload_step:
  prompt: |
    Сначала пришлите ВСЕ доступные материалы по клиенту (.docx или .json).
    Я автоматически начну вопросы через пару секунд после последнего файла.
intro_message:
  prompt: |
    Давай вместе сформируем повестку к стратегическому диалогу с клиентом.
    Подготовленная повестка позволит провести встречу максимально предметно и с пользой для клиента.
arrangements:
  prompt: |
    Необходимо вспомнить последние договорённости и актуальные для клиента темы для обсуждения, чтобы быть готовым к любому вопросу клиента.
  main_points: |
    Для формирования повестки я выбрала те договорённости и темы, которые, на мой взгляд, являются самыми важными.
  question: |
    Что еще вы хотите обсудить с клиентом на встрече?
analysis:
  prompt: |
    Спасибо! Анализирую клиента на основе выбранных тем и ваших знаний.
    Задам вам вопросы, которые помогут мне составить список гипотез для обсуждения с клиентом.

correction:
  prompt: |
    Выберите следующий шаг:
    
    
    
# Изменить кнопочку "Согласиться с гипотезами. Сформировать повестку к стратегическому диалогу"    
    
# При выборе кнопочки "Скорректировать текущие гипотезы" выводить:
# "Что вы хотите скорректировать?"

# При выборе кнопочки "Получить новые гипотезы:
# "Какие темы для обсуждения интересны клиенту?
# 
# Примеры:
# • Доля на рынке
# • Организационные ситуации
# • Операцонные ситуации
# • Финансовое положение
# • Состояние относительно конкурентов"

